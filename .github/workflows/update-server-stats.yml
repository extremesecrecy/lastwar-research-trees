name: Update Server Stats & Calendar

on:
  schedule:
    # Daily at 03:15 UTC (just after the 02:00 UTC server reset, so cpt-hedge's day has rolled over)
    - cron: '15 3 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh stats, season dates and #2013 calendar
        run: python update_server_stats.py

      - name: Check for changes
        id: changes
        run: |
          git add -N guides/server_seasons.json 2>/dev/null || true
          git diff --quiet -- guides/server_stats.json guides/server_seasons.json guides/lastwar_calendar.ics             && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push to main
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guides/server_stats.json guides/server_seasons.json guides/lastwar_calendar.ics
          git commit -m "chore: daily server stats + season dates ($(date -u +%Y-%m-%d))"
          git push origin main
