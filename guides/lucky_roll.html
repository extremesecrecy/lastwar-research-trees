<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OWOW Lucky Roll - Official Alliance Lottery</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Fredoka', 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .header {
    text-align: center;
    margin-bottom: 20px;
    z-index: 10;
  }
  .header img { height: 80px; margin-bottom: 8px; }
  .header h1 {
    font-size: 32px;
    text-transform: uppercase;
    letter-spacing: 3px;
    background: linear-gradient(90deg, #f4a261, #f4d35e, #f4a261);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
  }
  .header .sub {
    font-size: 14px;
    color: #7fb3a8;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 4px;
  }
  .header .alliance-tag {
    display: inline-block;
    background: rgba(127, 179, 168, 0.2);
    border: 1px solid #7fb3a8;
    border-radius: 5px;
    padding: 3px 14px;
    font-size: 13px;
    color: #7fb3a8;
    font-weight: bold;
    margin-top: 8px;
  }
  .header .classified {
    font-size: 10px;
    color: #fc5c65;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 6px;
    animation: blink 1.5s infinite;
  }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* Dice area */
  .dice-zone {
    text-align: center;
    z-index: 10;
    position: relative;
  }

  .dice-container {
    width: 180px;
    height: 180px;
    margin: 0 auto 24px auto;
    perspective: 600px;
    cursor: pointer;
  }

  .dice {
    width: 180px;
    height: 180px;
    background: linear-gradient(145deg, #f4a261, #e8914f);
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 80px;
    font-weight: 700;
    color: #fff;
    box-shadow: 0 8px 32px rgba(244, 162, 97, 0.4), inset 0 -4px 8px rgba(0,0,0,0.2);
    transition: transform 0.1s;
    user-select: none;
    position: relative;
  }
  .dice.rolling {
    animation: diceRoll 0.6s ease-out;
  }
  @keyframes diceRoll {
    0% { transform: rotateX(0deg) rotateY(0deg) scale(1); }
    20% { transform: rotateX(180deg) rotateY(90deg) scale(0.8); }
    40% { transform: rotateX(360deg) rotateY(180deg) scale(1.1); }
    60% { transform: rotateX(540deg) rotateY(270deg) scale(0.9); }
    80% { transform: rotateX(680deg) rotateY(340deg) scale(1.05); }
    100% { transform: rotateX(720deg) rotateY(360deg) scale(1); }
  }
  .dice .dice-dots {
    font-size: 72px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
  }

  .roll-btn {
    background: linear-gradient(135deg, #fc5c65, #e04e56);
    color: #fff;
    border: none;
    padding: 16px 48px;
    border-radius: 50px;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-family: 'Fredoka', sans-serif;
    box-shadow: 0 4px 20px rgba(252, 92, 101, 0.4);
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .roll-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 28px rgba(252, 92, 101, 0.6);
  }
  .roll-btn:active { transform: translateY(0); }
  .roll-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }
  .roll-btn .btn-shine {
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    animation: shine 2s infinite;
  }
  @keyframes shine { 0% { left: -100%; } 100% { left: 100%; } }

  .roll-count {
    font-size: 12px;
    color: #888;
    margin-top: 12px;
    letter-spacing: 1px;
  }

  /* Win screen */
  .win-screen {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 100;
    background: rgba(0,0,0,0.85);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .win-screen.show { display: flex; }

  .win-title {
    font-size: 64px;
    font-weight: 700;
    background: linear-gradient(90deg, #f4d35e, #f4a261, #fc5c65, #f4a261, #f4d35e);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: goldShift 2s linear infinite;
    text-transform: uppercase;
    letter-spacing: 4px;
    margin-bottom: 12px;
  }
  @keyframes goldShift { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }

  .win-number {
    font-size: 120px;
    font-weight: 700;
    color: #f4d35e;
    text-shadow: 0 0 30px rgba(244, 211, 94, 0.6), 0 0 60px rgba(244, 162, 97, 0.3);
    animation: numberPulse 0.5s ease-in-out infinite alternate;
  }
  @keyframes numberPulse { 0% { transform: scale(1); } 100% { transform: scale(1.08); } }

  .win-message {
    font-size: 24px;
    color: #7fb3a8;
    margin-top: 16px;
    max-width: 500px;
    line-height: 1.6;
  }
  .win-message .reward {
    display: inline-block;
    background: linear-gradient(135deg, #f4a261, #f4d35e);
    color: #1a1a2e;
    padding: 4px 16px;
    border-radius: 20px;
    font-weight: 700;
    margin-top: 8px;
  }

  .win-owow {
    font-size: 14px;
    color: #f4a261;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 24px;
    animation: blink 1s infinite;
  }

  .win-dismiss {
    margin-top: 24px;
    background: transparent;
    border: 2px solid #7fb3a8;
    color: #7fb3a8;
    padding: 10px 30px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Fredoka', sans-serif;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.2s;
  }
  .win-dismiss:hover {
    background: #7fb3a8;
    color: #1a1a2e;
  }

  /* Confetti */
  .confetti-piece {
    position: fixed;
    width: 10px;
    height: 10px;
    top: -10px;
    z-index: 101;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0% { top: -10px; transform: rotate(0deg) scale(1); opacity: 1; }
    80% { opacity: 1; }
    100% { top: 110vh; transform: rotate(720deg) scale(0.5); opacity: 0; }
  }

  /* Stars background */
  .stars {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 0;
    pointer-events: none;
  }
  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }

  .footer {
    position: fixed;
    bottom: 12px;
    text-align: center;
    font-size: 11px;
    color: #555;
    z-index: 10;
    letter-spacing: 1px;
  }

  @media (max-width: 600px) {
    .header h1 { font-size: 24px; }
    .dice-container, .dice { width: 140px; height: 140px; }
    .dice .dice-dots { font-size: 56px; }
    .roll-btn { padding: 14px 36px; font-size: 16px; }
    .win-title { font-size: 40px; }
    .win-number { font-size: 80px; }
    .win-message { font-size: 18px; padding: 0 20px; }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="header">
  <img src="skynet_logo.png" alt="OWOW SKYNET">
  <h1>OWOW Lucky Roll</h1>
  <div class="sub">Official Alliance Lottery System</div>
  <div class="alliance-tag">[OWOW] Old World Order</div>
  <div class="classified">CLASSIFIED: R5 AUTHORIZED PERSONNEL ONLY</div>
</div>

<div class="dice-zone">
  <div class="dice-container" onclick="rollDice()">
    <div class="dice" id="dice">
      <span class="dice-dots" id="diceFace">?</span>
    </div>
  </div>
  <button class="roll-btn" id="rollBtn" onclick="rollDice()">
    <span class="btn-shine"></span>
    Roll The Dice
  </button>
  <div class="roll-count" id="rollCount">Brutus is watching. Choose wisely.</div>
</div>

<div class="win-screen" id="winScreen">
  <div class="win-title" id="winTitle">YOU WON!!!</div>
  <div class="win-number" id="winNumber"></div>
  <div class="win-message" id="winMessage"></div>
  <div class="win-owow">OWOW SKYNET CONGRATULATES YOU</div>
  <button class="win-dismiss" onclick="dismissWin()">Roll Again (You Know You Want To)</button>
</div>

<div class="footer">
  [OWOW] Old World Order &bull; Kristen OWOW SKYNET &bull; Powered by Brutus's Approval
</div>

<script>
const DICE_FACES = ['\u2680','\u2681','\u2682','\u2683','\u2684','\u2685'];

const WIN_MESSAGES = [
  ["ABSOLUTE LEGEND!", "Brutus himself bows to your luck!", "Free shield for life (not really)"],
  ["UNSTOPPABLE!", "The server trembles at your dice game!", "Promoted to R6 (just kidding... unless?)"],
  ["GODLIKE ROLL!", "DVA just maxed her skills in your honor!", "Your enemies are shielding up RIGHT NOW"],
  ["MAXIMUM POWER!", "Rally the entire server \u2014 this commander CANNOT be stopped!", "+500% luck buff (source: trust me bro)"],
  ["CRITICAL HIT!", "The dice gods have spoken and they said YOUR NAME!", "Kristen is impressed. That's rare."],
  ["FLAWLESS VICTORY!", "Even the whales are jealous of this roll!", "You just earned 0 diamonds but infinite respect"],
  ["SUPREME COMMANDER!", "Server #2013 just felt a disturbance in the force!", "Brutus wants to know your secret"],
  ["PURE DOMINATION!", "This roll was so good it counted for Arms Race points!", "Saturday Enemy Buster? More like Enemy BUS-TED"],
  ["MEGA WIN!", "Old World Order? More like Old World WINNER!", "Your base just grew 3 HQ levels (in spirit)"],
  ["TACTICAL GENIUS!", "Sun Tzu wrote about this roll in Chapter 7!", "OWOW SKYNET has flagged you as: EXTREMELY LUCKY"],
  ["ABSOLUTELY CRACKED!", "This roll broke the algorithm!", "Kristen is recalculating... nope, still a winner"],
  ["HALL OF FAME!", "This goes straight to #wall-of-honor!", "Even Morrison's gear is jealous of this number"],
];

const REWARDS = [
  "1,000,000 Imaginary Diamonds",
  "Brutus's Personal Shield (24hr, unlimited uses, totally fake)",
  "Free R5 Promotion (valid in dreams only)",
  "DVA's Autograph (NFT, non-transferable, non-existent)",
  "Lifetime Supply of Radar Missions",
  "The Secret Formula to T10 Troops",
  "One Free Plunder Pass (for a server that doesn't exist)",
  "Kristen's Phone Number (it's just !ask)",
  "A Golden Toilet for Your HQ",
  "Free Name Change to 'ServerLegend2013'",
  "Brutus's Wi-Fi Password",
  "The Key to the Alliance Vault (spoiler: it's empty)",
];

let rollCount = 0;
let isRolling = false;

function rollDice() {
  if (isRolling) return;
  isRolling = true;

  const dice = document.getElementById('dice');
  const diceFace = document.getElementById('diceFace');
  const rollBtn = document.getElementById('rollBtn');

  rollBtn.disabled = true;
  dice.classList.add('rolling');

  // Rapid face changes during roll
  let flips = 0;
  const flipInterval = setInterval(() => {
    diceFace.textContent = DICE_FACES[Math.floor(Math.random() * 6)];
    flips++;
    if (flips > 12) {
      clearInterval(flipInterval);
      // Final result
      const result = Math.floor(Math.random() * 6);
      diceFace.textContent = DICE_FACES[result];
      dice.classList.remove('rolling');
      rollCount++;

      // Everyone wins!
      setTimeout(() => showWin(result + 1), 400);
    }
  }, 80);
}

function showWin(number) {
  const screen = document.getElementById('winScreen');
  const winNumber = document.getElementById('winNumber');
  const winMessage = document.getElementById('winMessage');
  const winTitle = document.getElementById('winTitle');

  const msgSet = WIN_MESSAGES[Math.floor(Math.random() * WIN_MESSAGES.length)];
  const reward = REWARDS[Math.floor(Math.random() * REWARDS.length)];

  winTitle.textContent = msgSet[0];
  winNumber.textContent = number;
  winMessage.innerHTML = msgSet[1] + '<br><span style="font-size:16px;color:#888;">' + msgSet[2] + '</span><br><span class="reward">\uD83C\uDFC6 Prize: ' + reward + '</span>';

  screen.classList.add('show');
  launchConfetti();

  document.getElementById('rollCount').textContent = 'Total rolls: ' + rollCount + ' | Win rate: 100% | Brutus approves.';
}

function dismissWin() {
  document.getElementById('winScreen').classList.remove('show');
  document.getElementById('rollBtn').disabled = false;
  isRolling = false;
  // Clear confetti
  document.querySelectorAll('.confetti-piece').forEach(c => c.remove());
}

function launchConfetti() {
  const colors = ['#f4a261','#f4d35e','#fc5c65','#5bc0de','#7fb3a8','#fff','#e04e56','#43a047'];
  const shapes = ['square','circle','triangle'];
  for (let i = 0; i < 80; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    const color = colors[Math.floor(Math.random() * colors.length)];
    const shape = shapes[Math.floor(Math.random() * shapes.length)];
    const size = 6 + Math.random() * 10;
    piece.style.width = size + 'px';
    piece.style.height = size + 'px';
    piece.style.left = Math.random() * 100 + 'vw';
    piece.style.background = color;
    piece.style.animationDuration = (2 + Math.random() * 3) + 's';
    piece.style.animationDelay = (Math.random() * 0.8) + 's';
    if (shape === 'circle') piece.style.borderRadius = '50%';
    if (shape === 'triangle') {
      piece.style.width = '0';
      piece.style.height = '0';
      piece.style.background = 'transparent';
      piece.style.borderLeft = size/2 + 'px solid transparent';
      piece.style.borderRight = size/2 + 'px solid transparent';
      piece.style.borderBottom = size + 'px solid ' + color;
    }
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 5000);
  }
}

// Generate stars
(function() {
  const container = document.getElementById('stars');
  for (let i = 0; i < 100; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.animationDelay = Math.random() * 3 + 's';
    star.style.width = (1 + Math.random() * 2) + 'px';
    star.style.height = star.style.width;
    container.appendChild(star);
  }
})();
</script>

</body>
</html>
